<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07090d"><link rel="stylesheet" href="fonts/fonts.css"></head><body>
<title>Kaleidoscope Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: full-bleed mirror stage on the left, a control desk on the right (RTL); on a phone the desk drops under the stage.
   Single dark look on purpose: the stage glows on black, like the box with the screen behind the mirrors. */
:root {
  --bg: #07090d; --panel: #11151d; --panel2: #171c26; --line: #252d3b; --fg: #e8edf4; --muted: #8b96a8;
  --accent: #7cf2dc; --on-accent: #032620; --sel: #0f2e2a; --hot: #ff4f7b; --amber: #ffb547; --well: #0a0d13;
  --display: "Heebo", "Segoe UI", "Arial Hebrew", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--display); overflow: hidden; }
* { box-sizing: border-box; }
#app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 360px; grid-template-rows: minmax(0, 1fr); }
#stageWrap { position: relative; min-width: 0; min-height: 0; background: #000; touch-action: none; overflow: hidden; }
#gl, #ov { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#ov { pointer-events: none; }
#hud { position: absolute; top: 10px; inset-inline-start: max(10px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; align-items: center; pointer-events: none; font: 12px/1 var(--mono); color: #cfd8e3; }
.pill { background: rgba(8,10,14,.66); border: 1px solid rgba(255,255,255,.08); border-radius: 999px; padding: 6px 10px; backdrop-filter: blur(6px); display: inline-flex; gap: 6px; align-items: center; }
#beatDot { width: 9px; height: 9px; border-radius: 50%; background: var(--hot); opacity: .25; }
#heartDot { font-size: 13px; transform-origin: center; }
#stageBtns { position: absolute; bottom: 12px; inset-inline-start: max(10px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; flex-wrap: wrap; }
#stageBtns button { background: rgba(8,10,14,.7); backdrop-filter: blur(6px); }
#panel { min-width: 0; min-height: 0; background: var(--panel); border-inline-start: 1px solid var(--line); display: flex; flex-direction: column; }
header.brand { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 10px; }
header.brand h1 { margin: 0; font-size: 19px; font-weight: 800; letter-spacing: .01em; }
header.brand h1 span { background: linear-gradient(90deg, #7cf2dc, #8fb4ff, #ff7bd5, #ffb547); -webkit-background-clip: text; background-clip: text; color: transparent; }
header.brand small { color: var(--muted); font-size: 12px; }
nav.tabs { display: flex; gap: 2px; padding: 8px 10px 0; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
nav.tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; color: var(--muted); padding: 8px 9px; font-weight: 600; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tabbody { flex: 1; overflow-y: auto; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 14px; }
section.grp { display: flex; flex-direction: column; gap: 10px; }
section.grp > h3 { margin: 0; font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.note { color: var(--muted); font-size: 12.5px; margin: 0; }
.note b { color: var(--fg); font-weight: 600; }
button { font: 600 13px/1 var(--display); color: var(--fg); background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; cursor: pointer; }
button:hover { border-color: #3a4558; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--sel); }
button:disabled { opacity: .45; cursor: default; }
.chips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.chips button { text-align: start; padding: 9px 10px; display: flex; gap: 8px; align-items: center; font-weight: 500; }
.chips button svg { flex: none; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ctl { display: grid; grid-template-columns: 112px minmax(0, 1fr) 44px; gap: 8px; align-items: center; }
.ctl label { color: #c3ccd8; font-size: 13px; }
.ctl output { font: 12px var(--mono); color: var(--muted); text-align: end; font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--accent); }
select { width: 100%; font: 13px var(--display); color: var(--fg); background: var(--well); border: 1px solid var(--line); border-radius: 7px; padding: 7px 8px; }
.tog { display: flex; gap: 8px; align-items: center; font-size: 13px; color: #c3ccd8; cursor: pointer; }
.tog input { accent-color: var(--accent); width: 16px; height: 16px; }
.meters { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.meter { display: flex; flex-direction: column; gap: 4px; font: 11px var(--mono); color: var(--muted); }
.meter i { display: block; height: 46px; background: var(--well); border: 1px solid var(--line); border-radius: 6px; position: relative; overflow: hidden; }
.meter i b { position: absolute; inset: auto 0 0 0; height: 0; background: linear-gradient(0deg, var(--accent), #8fb4ff); }
.meter.k i b { background: linear-gradient(0deg, var(--hot), var(--amber)); }
.big { font: 600 26px/1 var(--mono); font-variant-numeric: tabular-nums; }
.stat { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; }
.stat span { color: var(--muted); font-size: 12px; }
canvas.mini { width: 100%; height: 56px; background: var(--well); border: 1px solid var(--line); border-radius: 6px; display: block; }
.presets { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
.presets button { text-align: start; padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; line-height: 1.3; }
.presets button small { color: var(--muted); font-weight: 400; font-size: 12px; }
.tag { font: 600 10px/1 var(--mono); padding: 3px 6px; border-radius: 4px; background: var(--sel); color: var(--accent); align-self: flex-start; letter-spacing: .04em; }
.tag.td { background: #2a1630; color: #ff8ae2; }
.tag.ht { background: #3a1422; color: #ff7b9c; }
textarea { width: 100%; min-height: 90px; font: 11px/1.4 var(--mono); color: var(--fg); background: var(--well); border: 1px solid var(--line); border-radius: 7px; padding: 8px; resize: vertical; }
.sens { font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
#ytBox { position: absolute; top: 48px; inset-inline-end: max(10px, env(safe-area-inset-left, 0px)); width: min(300px, 46%); aspect-ratio: 16 / 9; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #000; z-index: 2; }
#ytBox iframe { width: 100%; height: 100%; border: 0; display: block; }
#ytBox button { position: absolute; top: 4px; inset-inline-start: 4px; padding: 4px 7px; background: rgba(8,10,14,.8); }
body.show #ytBox { opacity: .02; }
#toast { position: absolute; top: 52px; inset-inline-start: 50%; transform: translateX(50%); background: rgba(10,12,16,.9); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 86%; text-align: center; }
#toast.on { opacity: 1; }
body.show #panel { display: none; }
body.show #app { grid-template-columns: minmax(0, 1fr); }
body.show #hud, body.show #stageBtns { opacity: 0; }
body.show #stageBtns:hover { opacity: 1; }
body.selfrun, body.selfrun * { cursor: none; }
@media (max-width: 760px) {
  #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 52%) minmax(0, 1fr); }
  #panel { border-inline-start: 0; border-top: 1px solid var(--line); }
  header.brand { padding: 10px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
  .tabbody { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  body.show #app { grid-template-rows: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>

<div id="app" dir="rtl" lang="he">
  <div id="stageWrap">
    <canvas id="gl" aria-label="תצוגת הקליידוסקופ"></canvas>
    <canvas id="ov" aria-hidden="true"></canvas>
    <div id="hud">
      <span class="pill"><span id="beatDot"></span><span id="bpmHud">90</span> BPM</span>
      <span class="pill"><span id="heartDot">♥</span><span id="hrHud">72</span></span>
      <span class="pill" id="fpsHud">-- fps</span>
    </div>
    <div id="stageBtns">
      <button type="button" id="bDemo" class="primary">▶ טראק הדגמה</button>
      <button type="button" id="bShow" title="מקש H">מסך הופעה</button>
      <button type="button" id="bFull">מסך מלא</button>
    </div>
    <div id="ytBox" hidden><iframe id="ytFrame" title="נגן YouTube" allow="autoplay; encrypted-media" referrerpolicy="strict-origin-when-cross-origin"></iframe><button type="button" id="ytClose" aria-label="סגור את הנגן">✕</button></div>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>
  <aside id="panel">
    <header class="brand"><h1><span>קליידוסקופ</span> סטודיו</h1><small>מראות · חלקיקים · מוזיקה · חיישנים</small></header>
    <nav class="tabs" role="tablist" id="tabs"></nav>
    <div class="tabbody" id="tabbody"></div>
  </aside>
</div>
<video id="camVideo" playsinline muted hidden></video>
<video id="fileVideo" playsinline muted loop hidden></video>
<audio id="fileAudio" hidden></audio>

<script>
"use strict";
// ============================================================================================
//  Kaleidoscope Studio. One page, no build step. Sections:
//  1 state & presets · 2 mirror geometry · 3 WebGL renderer · 4 source canvas & particles
//  5 audio (demo / file / mic / MIDI clock) · 6 heart pulse (BPM, finger-on-camera PPG)
//  7 phone sensors · 8 product screen calibration · 9 UI · 11 selfie show (face-triggered) · 10 main loop
// ============================================================================================
const $ = (s, r = document) => r.querySelector(s);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const TAU = Math.PI * 2;
const store = {
  get(k, d) { try { const v = localStorage.getItem("kscope." + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("kscope." + k, JSON.stringify(v)); } catch (e) {} }
};
let RENDER = null; // set while the page renders a video frame by frame (see KS at the end)
function toast(msg, ms = 2600) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), ms); }

// ---------------------------------------------------------------- 1 · state & presets
const DEFAULTS = {
  mode: "tri60", ngon: 5, wedge: 8, hp: 7, hq: 3, sq: 5,
  zoom: 1, spin: 0.04, turn: 0, edge: 0.12, loss: 0.05, real: false, eyeZ: 0.15, fovR: 75, tubeR: 3, pulse: 0.3, hue: 0, sat: 1.1, bright: 1, flash: 0.6,
  bg: "glow", palette: "holo", trails: 0.82,
  pType: "holo", pCount: 420, pSize: 1, pSpeed: 1, pGrav: 1, pReact: 1, glow: 1,
  camMix: 0, mediaMix: 0,
  heartSrc: "music", heartBpm: 72,
  sRot: true, sGrav: true, sShake: true,
  autoBpm: true,
  rgb: 0.15, ripple: 0.25, strobe: 0, echo: 0.2, vj: false, vjBars: 8,
  // selfie show (section 11)
  selfNear: .2, selfHold: .8, selfCountdown: 3, selfRest: 6, selfLeave: true, selfLive: .45, selfHint: true, selfLen: 40, selfZoom: .95, selfMix: 1,
  selfPreset: "keep", selfMirror: true, selfShuffle: false, selfKeep: false, selfAuto: false,
  fx_pull: true, fx_flow: true, fx_swirl: true, fx_ripple: true, fx_melt: true, fx_shatter: true, fx_holo: true
};
const P = Object.assign({}, DEFAULTS, store.get("params", {}));
const PRESETS = [
  { id: "box", tag: "המוצר", name: "מנסרה קלאסית", desc: "שלוש מראות ב־60°, גליפים הולוגרפיים כמו בנייר שבקופסה",
    p: { mode: "tri60", pType: "holo", bg: "glow", palette: "holo", pCount: 460, zoom: 1, spin: 0.05, loss: 0.05, edge: 0.1, trails: 0.8 } },
  { id: "beads", tag: "המוצר", name: "חרוזי זכוכית", desc: "חרוזים שנופלים לפי הטיית הטלפון, כמו קליידוסקופ ביד",
    p: { mode: "tri60", pType: "beads", bg: "none", palette: "glass", pCount: 140, pSize: 1.2, trails: 0.35, loss: 0.07, spin: 0.0 } },
  { id: "sphere", tag: "המוצר", name: "הכדור · פרח החיים", desc: "עומדים בתוך הכדור, אור ירוק־זהב על דפוס פרח החיים, 120 משולשי מראה",
    p: { mode: "sphIn", sq: 5, pType: "holo", bg: "flower", palette: "flower", pCount: 320, trails: 0.75, spin: 0.05, edge: 0.18, zoom: 1.1 } },
  { id: "sphere-out", tag: "המוצר", name: "הכדור מבחוץ", desc: "הכדור כולו, עם תפרי המראות ופרח החיים",
    p: { mode: "sphOut", sq: 5, pType: "holo", bg: "flower", palette: "flower", pCount: 320, trails: 0.75, spin: 0.06, edge: 0.25 } },
  { id: "dt-drift", tag: "דאון טמפו", name: "סחף איטי", desc: "מנסרה של 3 מראות שמסתובבת לאט, זרימה רכה, הד זום ואדוות על הסאב",
    p: { mode: "tri60", pType: "flow", bg: "glow", palette: "flower", pCount: 380, spin: .025, trails: .93, echo: .55, ripple: .45, pulse: .25, flash: .35, edge: .08 } },
  { id: "dt-breath", tag: "דאון טמפו", name: "נשימה בכדור", desc: "בתוך הכדור, פרח החיים נושם עם הפד, מסלולים שמתרחבים עם הבס",
    p: { mode: "sphIn", sq: 5, pType: "orbits", bg: "flower", palette: "flower", pCount: 240, spin: .03, trails: .88, echo: .4, ripple: .3, pulse: .35, flash: .3 } },
  { id: "dt-ink", tag: "דאון טמפו", name: "דיו במים", desc: "פלזמה רכה ב-6 מראות שנשברות, תנועה של דיו במים",
    p: { mode: "ngon", ngon: 6, pType: "flow", bg: "plasma", palette: "ice", pCount: 260, spin: .02, trails: .95, ripple: .6, echo: .3, loss: .09, flash: .2 } },
  { id: "td-dome", tag: "TECHNODROME", tagc: "td", name: "כיפה מבפנים", desc: "עומדים בתוך כדור ענק, סימטריית איקוסהדרון, 128 BPM, ניצוצות בקיק",
    p: { mode: "sphIn", sq: 5, pType: "sparks", bg: "tris", palette: "techno", pCount: 520, pulse: 0.5, flash: 0.9, trails: 0.7, spin: 0.08 } },
  { id: "td-ball", tag: "TECHNODROME", tagc: "td", name: "כדור מראות · דרופ", desc: "כדור דיסקו שמשקף את הקליידוסקופ, נצנוצים על כל ביט",
    p: { mode: "ball", sq: 4, pType: "flow", bg: "tris", palette: "techno", pCount: 600, flash: 1, pulse: 0.3, trails: 0.86 } },
  { id: "td-tri", tag: "TECHNODROME", tagc: "td", name: "343 משולשים", desc: "משולש 30־60־90 עם רשת משולשים שנדלקת בקיק, כמו אריחי הכיפה",
    p: { mode: "tri30", pType: "sparks", bg: "tris", palette: "techno", pCount: 380, zoom: 1.4, flash: 0.8, trails: 0.6 } },
  { id: "ht-beat", tag: "מיפוי לב", tagc: "ht", name: "פעימת לב", desc: "לבבות שנפתחים מהמרכז על כל פעימה, מנדלה של 2 מראות",
    p: { mode: "wedge", wedge: 10, pType: "hearts", bg: "rings", palette: "heart", pCount: 320, pSize: 1.4, pulse: 0.55, trails: 0.85, spin: 0.03, heartSrc: "music" } },
  { id: "ht-ring", tag: "מיפוי לב", tagc: "ht", name: "21 טבעות", desc: "טבעות שמתכנסות ללב, במנסרה של 6 מראות שנשברת כמו אמיתית",
    p: { mode: "ngon", ngon: 6, pType: "hearts", bg: "rings", palette: "heart", pCount: 200, zoom: 1.3, loss: 0.08, pulse: 0.45 } },
  { id: "td-lasers", tag: "TECHNODROME", tagc: "td", name: "לייזרים במנסרה", desc: "מניפת לייזרים שמסתובבת עם הביט, פיצול RGB וסטרוב בדרופ",
    p: { mode: "tri60", pType: "lightning", bg: "lasers", palette: "techno", pCount: 300, rgb: .6, strobe: .8, trails: .55, flash: 1, edge: .3 } },
  { id: "td-tunnel", tag: "TECHNODROME", tagc: "td", name: "מנהרה", desc: "משולשים שנפתחים מהמרכז על כל ביט, בתוך מנסרה של 5 מראות",
    p: { mode: "ngon", ngon: 5, pType: "sparks", bg: "tunnel", palette: "techno", pCount: 400, echo: .6, rgb: .4, trails: .6 } },
  { id: "fireworks", tag: "מוזיקה", name: "זיקוקים בכדור", desc: "זיקוק על כל ביט, מתפוצץ בתוך כדור של 48 עותקים",
    p: { mode: "sphOut", sq: 4, pType: "fireworks", bg: "glow", palette: "fire", pCount: 420, trails: .8, ripple: .4, spin: .1 } },
  { id: "eq", tag: "מוזיקה", name: "אקולייזר מנדלה", desc: "הספקטרום של השיר כמנדלה של 12 עותקים, מסלולים נושמים עם הבס",
    p: { mode: "wedge", wedge: 12, pType: "orbits", bg: "spectrum", palette: "ice", pCount: 260, echo: .5, trails: .7 } },
  { id: "plasma", tag: "מוזיקה", name: "פלזמה היפרבולית", desc: "שדות צבע רכים בריצוף 5־4, אדוות על הבס",
    p: { mode: "hyp", hp: 5, hq: 4, pType: "flow", bg: "plasma", palette: "glass", pCount: 300, ripple: .5, trails: .9 } },
  { id: "ht-pulse", tag: "מיפוי לב", tagc: "ht", name: "לב פועם בכדור", desc: "כדור מראות שנושם עם הדופק, לבבות בכל פעימה",
    p: { mode: "ball", sq: 5, pType: "hearts", bg: "rings", palette: "heart", pCount: 300, pulse: .6, trails: .85, flash: .8 } },
  { id: "hyp", tag: "מתמטיקה", name: "יותר מדי מראות", desc: "7 משולשים סביב כל קודקוד: הריצוף ההיפרבולי שסוגר את מה שמראות אמיתיות לא יכולות",
    p: { mode: "hyp", hp: 7, hq: 3, pType: "flow", bg: "glow", palette: "ice", pCount: 500, trails: 0.9 } },
  { id: "cam", tag: "טלפון", name: "המצלמה בתוך המראות", desc: "מה שהמצלמה רואה נכנס למשולש. מטים את הטלפון כדי לסובב",
    p: { mode: "tri60", camMix: 1, pType: "holo", pCount: 160, bg: "none", trails: 0.2, spin: 0, sRot: true } }
];

// ---------------------------------------------------------------- 2 · mirror geometry
// Every flat mode is a convex polygon of mirrors. A pixel is folded back into the polygon by reflecting it across
// whichever mirror it sits behind, again and again: that is the light path inside a real mirror tube, unfolded.
// Triangles 60-60-60, 45-45-90, 30-60-90 and the square tile the plane, so the pattern closes perfectly.
// 5+ mirrors cannot tile a flat plane, so the images overlap and break, exactly as in a real 5- or 6-mirror tube.
const MODES = [
  { id: "tri60", name: "משולש 60°", m: "3 מראות", info: "<b>3 מראות שוות, 60° בכל פינה.</b> כך בנויה המנסרה שלך: המשולש מתמלא בלי תפרים לכל הכיוונים." },
