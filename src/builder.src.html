<title>Kaleidoscope Box Builder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: control desk on the right (RTL), a work area with tabs (3D box · cut sheets · view through the window · parts & steps · research).
   Single dark look on purpose, shared with Kaleidoscope Studio: a workshop bench at night, wood and mirror glow on black. */
:root {
  --bg: #07090d; --panel: #11151d; --panel2: #171c26; --line: #252d3b; --fg: #e8edf4; --muted: #8b96a8;
  --accent: #7cf2dc; --on-accent: #032620; --sel: #0f2e2a; --hot: #ff4f7b; --amber: #ffb547; --well: #0a0d13; --ok: #7be38f;
  --cut: #ff5a5a; --eng: #6aa8ff;
  --display: "Heebo", "Segoe UI", "Arial Hebrew", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--display); overflow: hidden; }
* { box-sizing: border-box; }
#app { height: 100%; display: grid; grid-template-columns: 350px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
#panel { grid-column: 1; grid-row: 1; min-width: 0; min-height: 0; background: var(--panel); border-inline-start: 1px solid var(--line); display: flex; flex-direction: column; }
#main { grid-column: 2; grid-row: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
header.brand { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
header.brand h1 { margin: 0; font-size: 19px; font-weight: 800; }
header.brand h1 span { background: linear-gradient(90deg, #7cf2dc, #8fb4ff, #ff7bd5, #ffb547); -webkit-background-clip: text; background-clip: text; color: transparent; }
header.brand p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
#presets { display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px; border-bottom: 1px solid var(--line); scrollbar-width: thin; }
#presets button { white-space: nowrap; font-size: 12px; padding: 6px 10px; }
#ctl { flex: 1; overflow-y: auto; padding: 4px 16px 16px; scrollbar-width: thin; }
.grp { border-bottom: 1px solid var(--line); padding: 12px 0; display: grid; gap: 9px; }
.grp h3 { margin: 0; font-size: 12px; letter-spacing: .06em; color: var(--accent); font-weight: 700; }
.ctl { display: grid; grid-template-columns: 112px minmax(0, 1fr) 58px; align-items: center; gap: 8px; }
.ctl > label { color: #c3ccd9; font-size: 12.5px; }
.ctl output { font: 12px var(--mono); color: var(--fg); text-align: end; font-variant-numeric: tabular-nums; }
.ctl.wide select, .ctl.wide .seg { grid-column: span 2; }
.hint { color: var(--muted); font-size: 11.5px; margin: -4px 0 0; }
input[type=range] { width: 100%; accent-color: var(--accent); }
select, input[type=number], textarea { background: var(--well); color: var(--fg); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; font: 13px var(--display); min-width: 0; width: 100%; }
input[type=number] { font-family: var(--mono); }
.seg { display: flex; background: var(--well); border: 1px solid var(--line); border-radius: 8px; padding: 2px; gap: 2px; }
.seg button { flex: 1; border: 0; background: transparent; padding: 5px 6px; font-size: 12.5px; border-radius: 6px; }
.seg button[aria-pressed=true] { background: var(--sel); color: var(--accent); }
button { background: var(--panel2); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; font: 500 13px var(--display); cursor: pointer; }
button:hover { border-color: #3a4558; }
button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 700; }
.tog { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: #c3ccd9; }
#tabs { display: flex; gap: 2px; padding: 8px 12px 0; border-bottom: 1px solid var(--line); overflow-x: auto; background: var(--bg); }
#tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: transparent; padding: 8px 12px; color: var(--muted); white-space: nowrap; }
#tabs button[aria-selected=true] { color: var(--fg); border-bottom-color: var(--accent); }
#views { flex: 1; min-height: 0; position: relative; }
.view { position: absolute; inset: 0; overflow: auto; }
#v3d { overflow: hidden; background: radial-gradient(ellipse at 50% 40%, #1a2130 0%, #07090d 70%); touch-action: none; }
#v3d canvas { display: block; width: 100%; height: 100%; }
.floatbar { position: absolute; bottom: 12px; inset-inline: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; pointer-events: none; }
.floatbar > * { pointer-events: auto; }
.chipbox { background: rgba(8,10,14,.72); backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,.08); border-radius: 10px; padding: 6px 10px; display: flex; gap: 10px; align-items: center; font-size: 12px; }
.chipbox input[type=range] { width: 120px; }
#summary { border-top: 1px solid var(--line); background: var(--panel); padding: 10px 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stat { display: grid; gap: 1px; min-width: 0; }
.stat b { font: 600 13px var(--mono); font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--muted); }
#summary .spacer { flex: 1; }
#goStudio { font-size: 14px; padding: 10px 16px; display: inline-flex; gap: 8px; align-items: center; text-decoration: none; }
.sheetwrap { padding: 16px; display: grid; gap: 18px; }
.sheet { background: #f4f1ea08; border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
.sheet h4 { margin: 0 0 8px; font-size: 13px; display: flex; gap: 10px; flex-wrap: wrap; }
.sheet h4 small { color: var(--muted); font-weight: 400; font-family: var(--mono); }
.sheet svg { width: 100%; height: auto; max-height: 62vh; display: block; background: #0d1118; border-radius: 6px; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid; vertical-align: middle; margin-inline-end: 5px; }
#vin { display: flex; flex-direction: column; background: #000; }
#vin .stagebox { flex: 1; min-height: 0; position: relative; }
#vin canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
#vin .stagebox > [hidden] { display: none !important; }
#vin .bar { padding: 10px 14px; background: var(--panel); border-top: 1px solid var(--line); display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
#vin .bar .ctl { grid-template-columns: auto 140px 64px; }
.doc { max-width: 860px; padding: 20px 22px 40px; display: grid; gap: 18px; }
.doc h2 { margin: 0; font-size: 18px; text-wrap: balance; }
.doc h3 { margin: 6px 0 0; font-size: 14px; color: var(--accent); }
.doc p, .doc li { line-height: 1.6; color: #d3dae5; max-width: 70ch; }
.doc ol, .doc ul { margin: 0; padding-inline-start: 20px; display: grid; gap: 6px; }
.doc a { color: var(--accent); }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: start; white-space: nowrap; }
th { color: var(--muted); font-weight: 500; background: var(--panel); }
td.n { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.warns { display: grid; gap: 6px; }
.warn { border: 1px solid #5a4520; background: #2a2112; color: #ffd89a; border-radius: 8px; padding: 7px 10px; font-size: 12.5px; }
.warn.good { border-color: #1f4a35; background: #0e2219; color: #b6f0cf; }
code, .mono { font-family: var(--mono); font-size: 12px; }
#toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--accent); color: var(--on-accent); padding: 9px 16px; border-radius: 10px; font-weight: 700; opacity: 0; transition: .25s; pointer-events: none; z-index: 20; }
#toast.on { opacity: 1; transform: translateX(-50%); }
.topbar3d { position: absolute; top: 12px; inset-inline: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; pointer-events: none; z-index: 3; }
.topbar3d > * { pointer-events: auto; }
.topbar3d .seg button { white-space: nowrap; }
.topbar3d .seg { background: rgba(8,10,14,.72); backdrop-filter: blur(6px); border-color: rgba(255,255,255,.08); }
button.chipbox { color: var(--fg); font: 500 12px var(--display); }
button.chipbox[aria-expanded=true] { border-color: var(--accent); color: var(--accent); }
.menuwrap { position: relative; }
.menu { position: absolute; top: calc(100% + 6px); inset-inline-start: 0; width: min(310px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: grid; gap: 8px; box-shadow: 0 14px 40px rgba(0,0,0,.55); z-index: 6; }
.menu > button { text-align: start; display: grid; gap: 1px; }
.menu > button small { color: var(--muted); font-size: 11.5px; font-weight: 400; }
.menu > button.primary small { color: var(--on-accent); }
.menu .mrow { display: grid; grid-template-columns: 40px minmax(0, 1fr); align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.menu .hint { margin: 0; }
.num { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 11px; background: var(--accent); color: var(--on-accent); font: 700 11.5px var(--mono); flex: none; }
.num.buy { background: var(--amber); color: #2a1a00; }
#plist { position: absolute; top: 62px; inset-inline-end: 12px; width: 280px; max-height: calc(100% - 140px); overflow: auto; background: rgba(12,15,21,.9); backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 12px; padding: 6px; z-index: 2; scrollbar-width: thin; }
#plist h4 { margin: 4px 8px 6px; font-size: 12px; color: var(--accent); display: flex; gap: 6px; }
#plist h4 small { color: var(--muted); font: 11px var(--mono); }
#plist .pi { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 8px; align-items: center; width: 100%; padding: 6px 8px; border: 0; border-radius: 8px; background: transparent; text-align: start; font-size: 12.5px; }
#plist .pi b { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#plist .pi small { display: block; color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#plist .pi .q { font: 11.5px var(--mono); color: var(--muted); }
#plist .pi:hover { background: #18202b; }
#plist .pi.on { background: var(--sel); box-shadow: inset 0 0 0 1px var(--accent); }
#lbl3d { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
#lbl3d span { position: absolute; left: 0; top: 0; display: grid; place-items: center; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 11px; background: var(--accent); color: var(--on-accent); font: 700 11.5px var(--mono); box-shadow: 0 0 0 2px rgba(7,9,13,.75), 0 2px 8px rgba(0,0,0,.5); }
#lbl3d span.act { background: var(--amber); color: #2a1a00; }
#lbl3d span.buy { background: var(--amber); color: #2a1a00; }
#lbl3d span.sel { background: #fff; color: #07090d; }
#tip3d { position: absolute; pointer-events: none; display: grid; gap: 2px; background: rgba(8,10,14,.94); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; font-size: 12px; max-width: 280px; z-index: 4; }
#tip3d b { display: flex; gap: 6px; align-items: center; font-weight: 600; }
#tip3d span:not(.num) { color: #c3ccd9; }
#stepcard { position: absolute; bottom: 64px; inset-inline: 12px; margin-inline: auto; max-width: 760px; background: rgba(12,15,21,.93); backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 8px; z-index: 2; max-height: 46%; overflow: auto; }
#stepcard .sh { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
#stepcard .sh b { font-size: 15px; }
#stepcard .badge { background: var(--amber); color: #2a1a00; font: 700 11.5px var(--display); padding: 3px 8px; border-radius: 6px; }
#stepcard .dots { display: flex; gap: 5px; margin-inline-start: auto; }
#stepcard .dots button { width: 12px; height: 12px; padding: 0; border-radius: 6px; background: #2a3342; border: 0; }
#stepcard .dots button.done { background: #3f7f74; }
#stepcard .dots button.on { background: var(--amber); width: 26px; }
#stepcard p { margin: 0; color: #d3dae5; line-height: 1.6; font-size: 13px; }
#stepcard .chips { display: flex; gap: 6px; flex-wrap: wrap; }
#stepcard .pchip { display: inline-flex; gap: 6px; align-items: center; padding: 3px 9px 3px 4px; font-size: 12px; border-radius: 14px; }
#stepcard .sb { display: flex; gap: 8px; flex-wrap: wrap; }
#stepcard .sb button:disabled { opacity: .4; cursor: default; }
#freebar.steps .exp { display: none; }
#v3d.steps #plist { max-height: calc(100% - 360px); min-height: 120px; }
#vparts tr[data-num] { cursor: pointer; }
#vparts tr[data-num]:hover td { background: #121822; }
@media (max-width: 900px) {
  #plist { top: auto; bottom: 64px; max-height: 40%; width: min(280px, calc(100% - 24px)); z-index: 4; box-shadow: 0 10px 30px rgba(0,0,0,.6); }
  #v3d.steps #plist { max-height: 40%; min-height: 0; }
  #stepcard { bottom: 10px; inset-inline: 8px; max-height: 44%; padding: 10px 12px; gap: 6px; }
  #stepcard p { font-size: 12.5px; line-height: 1.5; }
  #stepcard .chips { display: none; }
  #v3d.steps #freebar { display: none; }
  .topbar3d .chipbox { padding: 5px 8px; }
}
@media (max-width: 900px) {
  body { overflow: auto; }
  #app { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto; }
  #main { grid-column: 1; grid-row: 1; height: 78vh; }
  #panel { grid-column: 1; grid-row: 2; border-inline-start: 0; border-top: 1px solid var(--line); }
  #ctl { overflow: visible; }
  #tabs, #summary, header.brand, #presets, #ctl { padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
}
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>

<div id="app" dir="rtl" lang="he">
  <aside id="panel" aria-label="הגדרות">
    <header class="brand"><h1><span>Kaleidoscope</span> Box Builder</h1><p>מחולל קופסת קליידוסקופ: מראות, מעטפת, מסך ופריסה לחיתוך</p></header>
    <div id="presets" role="toolbar" aria-label="תבניות"></div>
    <div id="ctl"></div>
  </aside>
  <main id="main">
    <nav id="tabs" role="tablist"></nav>
    <div id="views">
      <section class="view" id="v3d" aria-label="תלת ממד">
        <canvas id="c3d"></canvas>
        <div id="lbl3d" aria-hidden="true"></div>
        <div id="tip3d" hidden></div>
        <div class="topbar3d">
          <div class="seg" role="group" aria-label="מצב תצוגה"><button type="button" data-mode3d="free" aria-pressed="true">תצוגה חופשית</button><button type="button" data-mode3d="steps" aria-pressed="false">הרכבה צעד-אחר-צעד</button></div>
          <button type="button" class="chipbox" id="tPlist" aria-expanded="false">רשימת חלקים</button>
          <label class="chipbox tog"><input type="checkbox" id="labels3d"> מספרים על החלקים</label>
          <div class="menuwrap"><button type="button" class="chipbox" id="snapBtn" aria-expanded="false">צילום באיכות גבוהה</button>
            <div class="menu" id="snapMenu" hidden>
              <div class="mrow"><span>רקע</span><div class="seg" id="snapBg"><button type="button" data-bg="transparent" aria-pressed="false">שקוף</button><button type="button" data-bg="studio" aria-pressed="true">סטודיו בהיר</button><button type="button" data-bg="dark" aria-pressed="false">כהה</button></div></div>
              <div class="mrow"><span>גודל</span><select id="snapRes"><option value="0">4K לרוחב · 3840×2160</option><option value="1">ריבוע · 2160×2160</option><option value="2">לאורך · 2160×3840</option></select></div>
              <button type="button" class="primary" id="snapSet">4 זוויות קבועות (ZIP)</button>
              <button type="button" id="snapNow">המבט הנוכחי (PNG)</button>
              <p class="hint">חזית, שלושה רבעים, מפורק וחתך. בלי תוויות ובלי ממשק.</p>
            </div></div>
          <div class="menuwrap"><button type="button" class="chipbox" id="dlBtn" aria-expanded="false">הורדת קובץ תלת-ממד</button>
            <div class="menu" id="dlMenu" hidden>
              <button type="button" data-x3d="glb"><b>GLB</b><small>Blender, טלפון, אתרים. עם צבעים, חריטה ומסך</small></button>
              <button type="button" data-x3d="3mf"><b>3MF</b><small>הדפסה ו-CAD. כל חלק גוף נפרד עם שם וצבע</small></button>
              <button type="button" data-x3d="stl"><b>STL</b><small>כל הקופסה בקובץ אחד, ציר Z למעלה</small></button>
              <button type="button" data-x3d="obj"><b>OBJ + MTL</b><small>כל תוכנת תלת-ממד, חלק לכל אובייקט</small></button>
              <button type="button" data-x3d="parts"><b>STL לכל חלק</b><small>ZIP, שם הקובץ לפי מספר החלק</small></button>
              <p class="hint">הכל במילימטרים, במצב מורכב.</p>
            </div></div>
        </div>
        <aside id="plist" hidden aria-label="רשימת חלקים"></aside>
        <div id="stepcard" hidden></div>
        <div class="floatbar" id="freebar">
          <div class="chipbox exp"><label for="explode">פירוק</label><input type="range" id="explode" min="0" max="1" step="0.01" value="0"></div>
          <label class="chipbox tog"><input type="checkbox" id="cutaway" checked> חתך (בלי דופן וגג)</label>
          <label class="chipbox tog"><input type="checkbox" id="guides3d" checked> קווי עזר</label>
          <label class="chipbox tog"><input type="checkbox" id="spin3d"> סיבוב אוטומטי</label>
          <button type="button" id="resetCam" class="chipbox">איפוס מבט</button>
        </div>
      </section>
      <section class="view" id="vcut" hidden aria-label="פריסה לחיתוך"></section>
      <section class="view" id="vin" hidden aria-label="מבט דרך החלון">
        <div class="stagebox"><canvas id="cin"></canvas><canvas id="cgl" style="touch-action:none;cursor:grab"></canvas><span class="hint" id="trHint" style="position:absolute;top:10px;inset-inline-start:12px;margin:0;background:rgba(8,10,14,.7);padding:5px 9px;border-radius:8px">מעקב קרניים אמיתי · גררו כדי להזיז את העין, גלגלת לקרב</span></div>
        <div class="bar">
          <div class="ctl"><label for="eyeDist">מרחק העין מהחלון</label><input type="range" id="eyeDist" min="5" max="800" step="5"><output id="o_eyeDist"></output></div><div class="ctl"><label for="fov">שדה ראייה</label><input type="range" id="fov" min="30" max="120" step="1"><output id="o_fov"></output></div><label class="tog"><input type="checkbox" id="flat"> שרטוט שטוח</label>
          <div class="stat"><b id="inImages">–</b><span>העתקים בשדה הראייה</span></div>
          <div class="stat"><b id="inDepth">–</b><span>שיקופים עמוקים נראים</span></div>
          <span class="hint" id="inNote" style="margin:0"></span>
        </div>
      </section>
      <section class="view" id="vparts" hidden aria-label="חלקים והוראות"></section>
      <section class="view" id="vres" hidden aria-label="מחקר"></section>
    </div>
    <footer id="summary"></footer>
  </main>
</div>
<div id="toast" dir="rtl" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
// =============================================================================================
//  Kaleidoscope Box Builder. One page, no build step. All lengths in millimetres, y up.
//  1 data & state · 2 2D geometry helpers · 3 design engine (build) · 4 laser parts & finger joints
//  5 nesting + SVG/DXF/ZIP export · 6 3D assembly (three.js) · 7 view through the window
//  8 parts list & steps · 9 studio sync · 10 UI
// =============================================================================================
const $ = (s, r = document) => r.querySelector(s);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const TAU = Math.PI * 2, SQ3 = Math.sqrt(3);
const f1 = x => (Math.round(x * 10) / 10).toString();
const f0 = x => Math.round(x).toString();
const store = {
  get(k, d) { try { const v = localStorage.getItem("kscope." + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("kscope." + k, JSON.stringify(v)); } catch (e) {} }
